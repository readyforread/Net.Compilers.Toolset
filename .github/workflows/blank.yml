name: Build Obfuscated

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore
        run: nuget restore SigmaPotato.sln

      - name: Build
        run: msbuild SigmaPotato.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Download ConfuserEx CLI
        shell: pwsh
        run: |
          iwr -Uri "https://github.com/mkaring/ConfuserEx/releases/download/v1.6.0/ConfuserEx-CLI.zip" -OutFile ConfuserEx.zip
          Expand-Archive ConfuserEx.zip -DestinationPath ConfuserEx -Force

      - name: Create Confuser project
        shell: pwsh
        run: |
          @"
          <project outputDir="Confused" baseDir="SigmaPotato\bin\Release" xmlns="http://confuser.codeplex.com">
            <rule pattern="true" preset="maximum" inherit="false">
              <protection id="anti debug" />
              <protection id="anti dump" />
              <protection id="anti ildasm" />
              <protection id="anti tamper" />
              <protection id="constants" />
              <protection id="ctrl flow" />
              <protection id="ref proxy" />
              <protection id="rename" />
            </rule>
            <module path="SigmaPotato.exe" />
          </project>
          "@ | Out-File -Encoding UTF8 confuser.crproj

      - name: Obfuscate
        shell: pwsh
        run: |
          .\ConfuserEx\Confuser.CLI.exe -n confuser.crproj

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sp-obfuscated
          path: Confused/SigmaPotato.exe
